<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.svg">
  <link rel="stylesheet" href="/luhmann.css">
  <title>Graph - Luhmann</title>
  <script src="/cytoscape.min.js"></script>
</head>
<body>
  <div class="luh-header">
    <div class="luh-brand"><a href="/">Luhmann</a></div>
    <div class="luh-nav"><a href="/graph">Graph</a> <a href="/tags">Tags</a> <a href="/broken">Broken</a></div>
    <div class="luh-spacer"></div>
    <form class="luh-search" method="GET" action="/search"><input name="q" placeholder="Search..."></form>
  </div>
  <div class="luh-body">
    <div class="luh-content" style="max-width: 60rem;">
      <h1 id="luh-graph-title">Note graph</h1>
      <p class="luh-none" id="luh-graph-hint">
        Click a node to open that note. Double-click to re-centre the graph on it.
        Use your browser Back button to return here.
      </p>
      <div id="luh-graph"></div>
    </div>
  </div>
  <script>
    function qparam(name) {
      var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : '';
    }

    var cy = null;

    function noteUrl(id) { return '/' + id.replace(/\.adoc$/, '.html'); }

    function showHint(msg) {
      document.getElementById('luh-graph-hint').textContent = msg;
    }

    function loadGraph(note, depth) {
      if (typeof cytoscape === 'undefined') {
        showHint('Graph library failed to load (cytoscape.min.js). ' +
                 'Check that the asset is being served.');
        return;
      }
      var url = note ? ('/api/graph?note=' + encodeURIComponent(note) + '&depth=' + (depth || 1))
                     : '/api/graph/all';
      fetch(url)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (!data.nodes || data.nodes.length === 0) {
            showHint('No notes to show in the graph yet.');
          }
          render(data, note);
        })
        .catch(function (err) {
          showHint('Could not load graph data: ' + err);
        });
    }

    function render(data, centerNote) {
      var elements = [];
      var present = {};
      (data.nodes || []).forEach(function (n) {
        present[n.id] = true;
        elements.push({ data: { id: n.id, label: n.title || n.id, center: !!n.center } });
      });
      // Skip any edge whose endpoints are not both present nodes (e.g. a
      // dangling xref to a note that does not exist); such an edge would make
      // cytoscape throw and abort the whole render.
      (data.edges || []).forEach(function (e) {
        if (present[e.from] && present[e.to]) {
          elements.push({ data: { source: e.from, target: e.to } });
        }
      });

      document.getElementById('luh-graph-title').textContent =
        centerNote ? ('Graph: ' + centerNote) : 'Note graph';

      cy = cytoscape({
        container: document.getElementById('luh-graph'),
        elements: elements,
        style: [
          { selector: 'node', style: {
              'label': 'data(label)', 'font-size': '11px', 'color': '#1a1a1a',
              'background-color': '#9bb8d8', 'text-valign': 'bottom',
              'text-margin-y': 4, 'width': 18, 'height': 18 } },
          { selector: 'node[?center]', style: {
              'background-color': '#3b6ea5', 'width': 28, 'height': 28,
              'font-weight': 'bold' } },
          { selector: 'edge', style: {
              'width': 1.5, 'line-color': '#cfd6df',
              'target-arrow-color': '#cfd6df', 'target-arrow-shape': 'triangle',
              'curve-style': 'bezier' } }
        ],
        layout: { name: 'cose', animate: false, padding: 30 }
      });

      // Single click: open the note (pushing graph state so Back returns here).
      cy.on('tap', 'node', function (evt) {
        var id = evt.target.id();
        location.href = noteUrl(id);
      });
      // Double click: re-centre the graph on that node without leaving.
      cy.on('dbltap', 'node', function (evt) {
        var id = evt.target.id();
        history.pushState({ note: id }, '', '/graph?note=' + encodeURIComponent(id));
        loadGraph(id, 1);
      });
    }

    window.addEventListener('popstate', function (e) {
      var note = (e.state && e.state.note) || qparam('note');
      loadGraph(note, 1);
    });

    loadGraph(qparam('note'), 1);

    // Live reload.
    (function () {
      var socket = new WebSocket(location.origin.replace(/^http/, 'ws') + '/ws');
      socket.addEventListener('message', function () { loadGraph(qparam('note'), 1); });
    })();
  </script>
</body>
</html>
