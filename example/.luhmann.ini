render-jobs = 8
editor = xterm -e vim

# Listen address. The default, 127.0.0.1, keeps the server private to this
# machine. To reach it from elsewhere on your network set 0.0.0.0 (every
# interface) or a single interface address such as 192.168.1.50.
#
# There is no authentication: anything that can reach the port can read every
# note. /api/edit is disabled automatically while bound off-loopback, because
# it spawns an editor process on the host.
#
# bind = 0.0.0.0
